debugging_guidance:
  when_user_reports_ui_issue:
    steps:
    - Find the page/component in PWA.
    - Check whether the UI uses FormHelper.
    - Find the FormHelper/client method.
    - Trace to API service/proto/controller.
    - Trace to EF repository/query.
    - Check SQL metadata/entity query/view/function.
    - Confirm metadata is not stale or duplicated.
    - Confirm no direct UI business logic is being introduced.
  when_user_reports_grid_issue:
    steps:
    - Find GridDefinition/GridViewDefinition metadata.
    - Find GridViewColumnDefinition metadata.
    - Find entity query/view/function used by the grid.
    - Check RowStatus filtering.
    - Check formatting and column aliases.
    - Check non-Telerik replacement if grid is being converted.
    - Preserve search/filter/sort/paging/actions.
  when_user_reports_status_or_workflow_issue:
    steps:
    - Check SCore.DataObjects row exists for the entity.
    - Check latest SCore.DataObjectTransition.
    - Check workflow/entity type mapping.
    - Check SCore.WorkflowGetNextStatus or equivalent.
    - Do not directly update status.
    - Use SCore.DataObjectTransitionUpsert for correction/fix logic.
  when_user_reports_integration_issue:
    steps:
    - Check source business record.
    - Check SCore.DataObjects row.
    - Check IntegrationOutbox or relevant integration table.
    - Check idempotency keys/duplicate prevention.
    - Check worker/service logs.
