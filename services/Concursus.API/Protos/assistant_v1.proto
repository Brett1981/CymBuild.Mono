/* =========================================================================================
   Upload service
========================================================================================= */

service AssistantUploadService {
  rpc CreateUploadSession (CreateAssistantUploadSessionRequest) returns (CreateAssistantUploadSessionReply);
  rpc CompleteUpload (CompleteAssistantUploadRequest) returns (CompleteAssistantUploadReply);
  rpc ListUserUploads (ListAssistantUserUploadsRequest) returns (ListAssistantUserUploadsReply);
  rpc AnalyzeScreenshot (AnalyzeAssistantScreenshotRequest) returns (AnalyzeAssistantScreenshotReply);
  rpc AttachUploadToConversation (AttachAssistantUploadToConversationRequest) returns (AttachAssistantUploadToConversationReply);
}

message CreateAssistantUploadSessionRequest {
  int32 user_id = 1;
  AssistantUploadPurpose upload_purpose = 2;
  string file_name = 3;
  string content_type = 4;
  int64 file_size_bytes = 5;
}

message CreateAssistantUploadSessionReply {
  string upload_guid = 1;
  string upload_url = 2;
  map<string, string> upload_headers = 3;
}

message CompleteAssistantUploadRequest {
  string upload_guid = 1;
  google.protobuf.StringValue conversation_guid = 2;
  google.protobuf.StringValue knowledge_item_guid = 3;
  string storage_url = 4;
  string file_name = 5;
  string content_type = 6;
  int64 file_size_bytes = 7;
  AssistantUploadPurpose upload_purpose = 8;
  AssistantProcessingStatus processing_status = 9;
}

message CompleteAssistantUploadReply {
  AssistantUploadModel upload = 1;
}

message ListAssistantUserUploadsRequest {
  int32 user_id = 1;
}

message ListAssistantUserUploadsReply {
  repeated AssistantUploadModel uploads = 1;
}

message AnalyzeAssistantScreenshotRequest {
  string upload_guid = 1;
  google.protobuf.StringValue conversation_guid = 2;
  AssistantMode mode = 3;
}

message AnalyzeAssistantScreenshotReply {
  string upload_guid = 1;
  string detected_screen_summary = 2;
  repeated string notable_sections = 3;
  repeated string likely_next_actions = 4;
  repeated string possible_mistakes = 5;
  double confidence_score = 6;
}

message AttachAssistantUploadToConversationRequest {
  string upload_guid = 1;
  string conversation_guid = 2;
}

message AttachAssistantUploadToConversationReply {
  AssistantUploadModel upload = 1;
}

/* =========================================================================================
   Admin service
========================================================================================= */

service AssistantAdminService {
  rpc GetAdminDashboardSummary (GetAssistantAdminDashboardSummaryRequest) returns (GetAssistantAdminDashboardSummaryReply);
  rpc ListFeedback (ListAssistantFeedbackRequest) returns (ListAssistantFeedbackReply);
  rpc ListFailedAnswers (ListAssistantFailedAnswersRequest) returns (ListAssistantFailedAnswersReply);
  rpc ListContentGaps (ListAssistantContentGapsRequest) returns (ListAssistantContentGapsReply);
  rpc AssignContentGap (AssignAssistantContentGapRequest) returns (AssignAssistantContentGapReply);
  rpc ResolveContentGap (ResolveAssistantContentGapRequest) returns (ResolveAssistantContentGapReply);
}

message GetAssistantAdminDashboardSummaryRequest {}

message GetAssistantAdminDashboardSummaryReply {
  AssistantDashboardSummaryModel summary = 1;
}

message ListAssistantFeedbackRequest {
  bool include_helpful = 1;
  bool include_unhelpful = 2;
}

message ListAssistantFeedbackReply {
  repeated AssistantFeedbackModel feedback = 1;
}

message AssistantFailedAnswerModel {
  string conversation_guid = 1;
  string message_guid = 2;
  string conversation_title = 3;
  string message_preview = 4;
  double confidence_score = 5;
  google.protobuf.Timestamp created_utc = 6;
}

message ListAssistantFailedAnswersRequest {
  double max_confidence_score = 1;
  int32 take = 2;
}

message ListAssistantFailedAnswersReply {
  repeated AssistantFailedAnswerModel failed_answers = 1;
}

message ListAssistantContentGapsRequest {
  AssistantContentGapStatus status = 1;
}

message ListAssistantContentGapsReply {
  repeated AssistantContentGapModel gaps = 1;
}

message AssignAssistantContentGapRequest {
  string content_gap_guid = 1;
  google.protobuf.StringValue suggested_knowledge_item_guid = 2;
  AssistantContentGapStatus status = 3;
}

message AssignAssistantContentGapReply {
  AssistantContentGapModel gap = 1;
}

message ResolveAssistantContentGapRequest {
  string content_gap_guid = 1;
  AssistantContentGapStatus status = 2;
}

message ResolveAssistantContentGapReply {
  AssistantContentGapModel gap = 1;
}

/* =========================================================================================
   Analytics service
========================================================================================= */

service AssistantAnalyticsService {
  rpc GetTopQuestions (GetAssistantTopQuestionsRequest) returns (GetAssistantTopQuestionsReply);
  rpc GetTopicTrends (GetAssistantTopicTrendsRequest) returns (GetAssistantTopicTrendsReply);
  rpc GetFailedAnswerSummary (GetAssistantFailedAnswerSummaryRequest) returns (GetAssistantFailedAnswerSummaryReply);
  rpc GetSourceUsageSummary (GetAssistantSourceUsageSummaryRequest) returns (GetAssistantSourceUsageSummaryReply);
  rpc GetWorkflowUsageSummary (GetAssistantWorkflowUsageSummaryRequest) returns (GetAssistantWorkflowUsageSummaryReply);
}

message GetAssistantTopQuestionsRequest {
  int32 take = 1;
}

message GetAssistantTopQuestionsReply {
  repeated AssistantTopicMetric topics = 1;
}

message GetAssistantTopicTrendsRequest {
  int32 days = 1;
}

message GetAssistantTopicTrendsReply {
  repeated AssistantTopicMetric topics = 1;
}

message GetAssistantFailedAnswerSummaryRequest {
  int32 days = 1;
}

message GetAssistantFailedAnswerSummaryReply {
  int32 failed_answer_count = 1;
  int32 unhelpful_feedback_count = 2;
}

message GetAssistantSourceUsageSummaryRequest {
  int32 take = 1;
}

message GetAssistantSourceUsageSummaryReply {
  repeated AssistantSourceUsageMetric sources = 1;
}

message AssistantWorkflowUsageMetric {
  string workflow_template_guid = 1;
  string title = 2;
  int32 usage_count = 3;
}

message GetAssistantWorkflowUsageSummaryRequest {
  int32 take = 1;
}

message GetAssistantWorkflowUsageSummaryReply {
  repeated AssistantWorkflowUsageMetric workflows = 1;
}
