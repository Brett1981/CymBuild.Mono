  rpc GetKnowledgeItem (GetAssistantKnowledgeItemRequest) returns (GetAssistantKnowledgeItemReply);
  rpc GetKnowledgeCategories (GetAssistantKnowledgeCategoriesRequest) returns (GetAssistantKnowledgeCategoriesReply);
  rpc GetFeaturedKnowledge (GetAssistantFeaturedKnowledgeRequest) returns (GetAssistantFeaturedKnowledgeReply);
  rpc GetRelatedKnowledge (GetAssistantRelatedKnowledgeRequest) returns (GetAssistantRelatedKnowledgeReply);

  rpc CreateKnowledgeItem (CreateAssistantKnowledgeItemRequest) returns (CreateAssistantKnowledgeItemReply);
  rpc UpdateKnowledgeItem (UpdateAssistantKnowledgeItemRequest) returns (UpdateAssistantKnowledgeItemReply);
  rpc PublishKnowledgeItem (PublishAssistantKnowledgeItemRequest) returns (PublishAssistantKnowledgeItemReply);
  rpc ReplaceKnowledgeItemVersion (ReplaceAssistantKnowledgeItemVersionRequest) returns (ReplaceAssistantKnowledgeItemVersionReply);
  rpc ListKnowledgeVersions (ListAssistantKnowledgeVersionsRequest) returns (ListAssistantKnowledgeVersionsReply);
}

message SearchAssistantKnowledgeRequest {
  string search_text = 1;
  google.protobuf.StringValue category_guid = 2;
  bool published_only = 3;
  bool authoritative_first = 4;
}

message SearchAssistantKnowledgeReply {
  repeated AssistantKnowledgeItemModel items = 1;
}

message GetAssistantKnowledgeItemRequest {
  string knowledge_item_guid = 1;
}

message GetAssistantKnowledgeItemReply {
  AssistantKnowledgeItemModel item = 1;
}

message GetAssistantKnowledgeCategoriesRequest {}

message GetAssistantKnowledgeCategoriesReply {
  repeated AssistantKnowledgeCategoryModel categories = 1;
}

message GetAssistantFeaturedKnowledgeRequest {
  int32 take = 1;
}

message GetAssistantFeaturedKnowledgeReply {
  repeated AssistantKnowledgeItemModel items = 1;
}

message GetAssistantRelatedKnowledgeRequest {
  string knowledge_item_guid = 1;
  int32 take = 2;
}

message GetAssistantRelatedKnowledgeReply {
  repeated AssistantKnowledgeItemModel items = 1;
}

message CreateAssistantKnowledgeItemRequest {
  string title = 1;
  string slug = 2;
  google.protobuf.StringValue knowledge_category_guid = 3;
  string content_type_code = 4;
  string source_type_code = 5;
  string storage_url = 6;
  google.protobuf.StringValue preview_url = 7;
  google.protobuf.StringValue summary = 8;
  bool is_authoritative = 9;
  bool is_published = 10;
  int32 created_by_user_id = 11;
}

message CreateAssistantKnowledgeItemReply {
  AssistantKnowledgeItemModel item = 1;
}

message UpdateAssistantKnowledgeItemRequest {
  string knowledge_item_guid = 1;
  string title = 2;
  string slug = 3;
  google.protobuf.StringValue knowledge_category_guid = 4;
  string content_type_code = 5;
  string source_type_code = 6;
  string storage_url = 7;
  google.protobuf.StringValue preview_url = 8;
  google.protobuf.StringValue summary = 9;
  bool is_authoritative = 10;
  bool is_published = 11;
  int32 updated_by_user_id = 12;
}

message UpdateAssistantKnowledgeItemReply {
  AssistantKnowledgeItemModel item = 1;
}

message PublishAssistantKnowledgeItemRequest {
  string knowledge_item_guid = 1;
  bool is_published = 2;
  int32 updated_by_user_id = 3;
}

message PublishAssistantKnowledgeItemReply {
  AssistantKnowledgeItemModel item = 1;
}

message ReplaceAssistantKnowledgeItemVersionRequest {
  string knowledge_item_guid = 1;
  string storage_url = 2;
  google.protobuf.StringValue extracted_text = 3;
  string extraction_status_code = 4;
  google.protobuf.StringValue metadata_json = 5;
  google.protobuf.StringValue file_hash = 6;
  int32 created_by_user_id = 7;
}

message ReplaceAssistantKnowledgeItemVersionReply {
  AssistantKnowledgeVersionModel version = 1;
}

message ListAssistantKnowledgeVersionsRequest {
  string knowledge_item_guid = 1;
}

message ListAssistantKnowledgeVersionsReply {
  repeated AssistantKnowledgeVersionModel versions = 1;
}

/* =========================================================================================
   Workflow service
========================================================================================= */

service AssistantWorkflowService {
  rpc ListWorkflowTemplates (ListAssistantWorkflowTemplatesRequest) returns (ListAssistantWorkflowTemplatesReply);
  rpc GetWorkflowTemplate (GetAssistantWorkflowTemplateRequest) returns (GetAssistantWorkflowTemplateReply);
  rpc StartWorkflowRun (StartAssistantWorkflowRunRequest) returns (StartAssistantWorkflowRunReply);
  rpc AdvanceWorkflowRun (AdvanceAssistantWorkflowRunRequest) returns (AdvanceAssistantWorkflowRunReply);
  rpc CompleteWorkflowRun (CompleteAssistantWorkflowRunRequest) returns (CompleteAssistantWorkflowRunReply);
  rpc ListPlaybooks (ListAssistantPlaybooksRequest) returns (ListAssistantPlaybooksReply);
  rpc GetPlaybook (GetAssistantPlaybookRequest) returns (GetAssistantPlaybookReply);

  rpc CreateWorkflowTemplate (CreateAssistantWorkflowTemplateRequest) returns (CreateAssistantWorkflowTemplateReply);
  rpc UpdateWorkflowTemplate (UpdateAssistantWorkflowTemplateRequest) returns (UpdateAssistantWorkflowTemplateReply);
  rpc PublishWorkflowTemplate (PublishAssistantWorkflowTemplateRequest) returns (PublishAssistantWorkflowTemplateReply);
  rpc FeatureWorkflowTemplate (FeatureAssistantWorkflowTemplateRequest) returns (FeatureAssistantWorkflowTemplateReply);
}

message AssistantPlaybookStepModel {
  string guid = 1;
  string playbook_guid = 2;
  int32 step_order = 3;
  string title = 4;
  string instruction_markdown = 5;
  bool is_optional = 6;
  google.protobuf.StringValue expected_outcome = 7;
}

message AssistantPlaybookModel {
  string guid = 1;
  google.protobuf.Int32Value user_id = 2;
  string title = 3;
  google.protobuf.StringValue summary = 4;
  string playbook_type_code = 5;
  AssistantVisibility visibility = 6;
  google.protobuf.StringValue source_conversation_guid = 7;
  google.protobuf.StringValue source_workflow_run_guid = 8;
  int32 created_by_user_id = 9;
  google.protobuf.Timestamp created_utc = 10;
  google.protobuf.Timestamp updated_utc = 11;
  bool is_featured = 12;
  repeated AssistantPlaybookStepModel steps = 13;
}

message ListAssistantWorkflowTemplatesRequest {
  bool published_only = 1;
  bool featured_only = 2;
  google.protobuf.StringValue audience_code = 3;
